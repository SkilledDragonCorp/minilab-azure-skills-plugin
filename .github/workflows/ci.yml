name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  npm_config_registry: "https://registry.npmjs.org"

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo ok
